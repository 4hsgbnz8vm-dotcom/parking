<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>듣기 조사 결과</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --sub:#8a8a8a; --line:#e4e4e4; --soft:#f4f4f4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Noto Sans KR",system-ui,sans-serif; color:var(--ink); background:#fff; word-break:keep-all;
         max-width:560px; margin:0 auto; padding:22px 18px 60px; }
  h1 { font-size:24px; font-weight:700; }
  .sub { color:var(--sub); font-size:13px; margin-top:2px; }
  .card { border:1px solid var(--line); border-radius:16px; padding:18px; margin-top:16px; }
  .ct { font-size:13px; color:var(--sub); margin-bottom:10px; }
  label { display:block; font-size:13px; color:var(--sub); margin:14px 0 6px; }
  input, textarea { width:100%; font:inherit; font-size:16px; border:1px solid #d6d6d6; border-radius:10px; padding:11px 12px; }
  textarea { min-height:90px; resize:vertical; }
  .pick { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
  .pick button { font:inherit; font-size:16px; font-weight:500; padding:12px 0; border-radius:10px; border:1.5px solid #cfcfcf; background:#fff; color:var(--ink); }
  .pick button.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .btn { font:inherit; font-size:16px; font-weight:700; width:100%; padding:14px; border-radius:12px; border:none; background:var(--ink); color:#fff; margin-top:14px; }
  .btn:disabled { background:#cfcfcf; }
  .ghost { font:inherit; font-size:14px; padding:8px 12px; border-radius:10px; border:1px solid #cfcfcf; background:#fff; color:#333; margin-top:12px; }
  .msg { font-size:14px; color:#2b7a3d; margin-top:10px; min-height:20px; }
  details summary { font-size:14px; color:#444; cursor:pointer; }
  .stat { display:flex; gap:22px; }
  .stat div b { display:block; font-size:28px; }
  .stat div span { font-size:13px; color:var(--sub); }
  .bars { margin-top:14px; }
  .bar { display:grid; grid-template-columns:100px 1fr 26px; align-items:center; gap:8px; margin:5px 0; font-size:14px; }
  .bar i { display:block; height:14px; background:var(--ink); border-radius:4px; min-width:2px; }
  .bar .n { text-align:right; color:#444; }
  .row { border-top:1px solid var(--line); padding:11px 0; display:grid; grid-template-columns:1fr auto; gap:8px; }
  .row .t { font-size:15px; }
  .row .t b { margin-right:6px; }
  .row .s { font-size:14px; color:#555; margin-top:3px; }
  .row button { font:inherit; font-size:13px; border:1px solid #ddd; background:#fff; border-radius:8px; padding:6px 9px; color:#777; align-self:start; }
  .row button.sure { border-color:#c33; color:#c33; }
  .note { font-size:12.5px; color:var(--sub); margin-top:10px; line-height:1.6; }
  .empty { font-size:14px; color:var(--sub); padding:10px 0; }
  .map { font-size:13px; color:#555; line-height:1.7; margin-top:6px; }
</style>
</head>
<body>
<h1>듣기 조사 결과</h1>
<div class="sub">I Am Sitting in a Model, 연구자용</div>

<div class="msg" id="msg"></div>
<div class="card">
  <div class="ct">결과</div>
  <div class="stat">
    <div><b id="cnt">0</b><span>참여자</span></div>
    <div><b id="avg">-</b><span>평균 회차 (원본 0)</span></div>
    <div><b id="none">0</b><span>끝까지 못 들음</span></div>
  </div>
  <div class="bars" id="bars"></div>
  <button class="ghost" id="copy" type="button">결과 복사</button>
  <div id="list"></div>
  <div class="note" id="where">저장 위치 확인 중…</div>
  <div class="map">번호와 회차: 1번 30회차, 2번 10회차, 3번 6회차, 4번 5회차, 5번 4회차, 6번 3회차, 7번 2회차, 8번 1회차, 9번 원본</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAvyANB0e_bd78hv7viato-bkhRnTMAqmc",
  authDomain: "parking-3b761.firebaseapp.com",
  databaseURL: "https://parking-3b761-default-rtdb.firebaseio.com/",
  projectId: "parking-3b761",
  appId: "1:737089930127:web:402f1ae8dfbfb495a741fa"
};
firebase.initializeApp(firebaseConfig);
const ref = firebase.database().ref("listening_survey/responses");
const STEPS = [30, 10, 6, 5, 4, 3, 2, 1, 0];
const OPTS = [1, 2, 3, 4, 5, 6, 7, 8, 9, -1];
const passOf = n => n === -1 ? null : STEPS[n - 1];
const passLabel = p => p === 0 ? "원본" : p + "회차";
const label = n => n === -1 ? "없음" : `${n}번 (${passLabel(passOf(n))})`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);
const ms = r => typeof r.at === "number" ? r.at : 0;
let rows = [], unsub = null;

let msgT;
function flash(t, bad) { $("msg").style.color = bad ? "#c33" : "#2b7a3d"; $("msg").textContent = t; clearTimeout(msgT); msgT = setTimeout(() => $("msg").textContent = "", 3000); }

function render() {
  const heard = rows.filter(r => r.step >= 1);
  $("cnt").textContent = rows.length;
  $("none").textContent = rows.filter(r => r.step === -1).length;
  $("avg").textContent = heard.length ? (heard.reduce((s, r) => s + passOf(r.step), 0) / heard.length).toFixed(1) : "-";
  const max = Math.max(1, ...OPTS.map(n => rows.filter(r => r.step === n).length));
  $("bars").innerHTML = OPTS.map(n => {
    const c = rows.filter(r => r.step === n).length;
    return `<div class="bar"><span>${label(n)}</span><i style="width:${c / max * 100}%"></i><span class="n">${c}</span></div>`;
  }).join("");
  const sorted = [...rows].sort((a, b) => ms(b) - ms(a));
  $("list").innerHTML = sorted.length ? sorted.map(r => `
    <div class="row"><div><div class="t"><b>${esc(label(r.step))}</b>${esc(r.name || "이름 없음")}</div>
    ${r.text ? `<div class="s">${esc(r.text)}</div>` : ""}</div>
    <button type="button" data-id="${esc(r.id)}">삭제</button></div>`).join("")
    : `<div class="empty">아직 기록 없음</div>`;
}

$("where").textContent = "불러오는 중…";
const loadT = setTimeout(() => { $("where").textContent = "연결이 늦어요. 잠시 뒤 새로고침해 주세요."; }, 10000);
ref.on("value", snap => {
  clearTimeout(loadT);
  const v = snap.val() || {};
  rows = Object.entries(v).map(([id, d]) => ({ id, ...d })).filter(r => typeof r.step === "number");
  render();
  $("where").textContent = "참가자가 제출을 누르면 여기에 바로 들어와요.";
}, () => { clearTimeout(loadT); $("where").textContent = "결과를 불러오지 못했어요."; });

$("list").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "정말 삭제"; setTimeout(() => { b.classList.remove("sure"); b.textContent = "삭제"; }, 3000); return; }
  try { await ref.child(b.dataset.id).remove(); } catch (err) { flash("삭제 실패", true); }
});

$("copy").addEventListener("click", async () => {
  const lines = [`참여자 ${rows.length}명, 평균 ${$("avg").textContent}회차 (원본은 0), 끝까지 못 들음 ${$("none").textContent}명`,
    OPTS.map(n => `${label(n)} ${rows.filter(r => r.step === n).length}`).join(", "), "",
    ...[...rows].sort((a, b) => ms(a) - ms(b)).map(r => `${label(r.step)}\t${r.name || ""}\t${r.text || ""}`)];
  try { await navigator.clipboard.writeText(lines.join("\n")); flash("복사됨"); } catch (e) { flash("복사가 안 돼요", true); }
});
render();
</script>
</body>
</html>
