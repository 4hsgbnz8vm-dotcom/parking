<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>주차장 현황</title>
<style>
  :root {
    --bg: #F7F5F0;
    --ink: #1F2E28;
    --muted: #6b6b63;
    --faint: #8A8A82;
    --border: #D8D5CB;
    --cafe: #2F6F62;
    --cafe-bg: #EAF2EF;
    --donkatsu: #9C6B2E;
    --donkatsu-bg: #F5EEE1;
    --danger: #C1443A;
    --danger-bg: #FBEAE8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 90px; transition: padding-bottom 0.3s ease; }
  header { margin-bottom: 20px; }
  .headrow { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  .count { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; }
  .count .num { color: var(--cafe); }
  .count .num.full { color: var(--danger); }
  .count .of { color: var(--faint); }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 28px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }

  .spot { border-radius: 16px; padding: 18px; min-height: 110px; }
  .spot.empty {
    border: 2px dashed var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .spot.empty .idx { font-family: ui-monospace, monospace; font-size: 34px; color: #C7C4B8; }
  .spot.empty .label { font-size: 13px; color: #B9B6AB; }

  .spot.filled { border: 1px solid transparent; }
  .spot .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .spot .tag-spot { font-family: ui-monospace, monospace; font-size: 12px; color: var(--faint); }
  .spot .plate { font-size: 20px; font-weight: 800; margin-top: 2px; word-break: break-all; }
  .badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; color: #fff; white-space: nowrap; margin-left: 8px; }
  .phone { font-size: 14px; color: var(--muted); margin-bottom: 2px; }
  .checkin { font-size: 13px; color: var(--faint); margin-bottom: 12px; }
  .bottomrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .timer { font-family: ui-monospace, monospace; font-size: 18px; }
  .timer.over { color: var(--danger); font-weight: 700; }
  .out-btn {
    font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 10px;
    background: #fff; border: 1px solid var(--border); cursor: pointer;
  }
  .out-btn:active { transform: scale(0.96); }
  .bar-track { margin-top: 12px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.6); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s; }

  #formSheet {
    background: #fff; border: 1px solid #E4E1D8;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    max-width: 720px; margin: 0 auto;
    box-shadow: 0 -6px 20px rgba(31,46,40,0.10);
    border-radius: 16px 16px 0 0;
  }
  .sheet-handle {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: none; border: none; padding: 14px; font-size: 15px; font-weight: 700;
    color: var(--ink); cursor: pointer;
  }
  .sheet-handle .chevron { font-size: 12px; transition: transform 0.25s ease; }
  #formSheet.open .sheet-handle .chevron { transform: rotate(180deg); }
  .sheet-body {
    max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
  }
  #formSheet.open .sheet-body { max-height: 70vh; overflow-y: auto; }
  .sheet-body-inner { padding: 0 20px calc(20px + env(safe-area-inset-bottom)); }
  form { margin: 0; }
  form h2 { font-size: 17px; font-weight: 700; margin: 0 0 16px; }
  .field-row { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 14px; }
  @media (min-width: 640px) { .field-row { grid-template-columns: 1fr 1fr; } }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text] {
    width: 100%; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 16px; outline: none;
  }
  input[type=text]:focus { box-shadow: 0 0 0 2px var(--cafe); }
  .store-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .store-btn {
    flex: 1; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 15px;
    border: 1px solid var(--border); background: #fff; cursor: pointer;
  }
  .error { color: var(--danger); font-size: 14px; margin-bottom: 12px; }
  .submit-btn {
    width: 100%; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 16px;
    color: #fff; background: var(--ink); border: none; cursor: pointer;
  }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .status-line { text-align: center; font-size: 13px; color: var(--faint); margin-top: 16px; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal-bg.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 22px; max-width: 360px; width: 100%; }
  .modal h3 { margin: 0 0 8px; font-size: 17px; }
  .modal p { font-size: 14px; color: var(--muted); margin-bottom: 18px; }
  .modal-row { display: flex; gap: 8px; }
  .modal-row button { flex: 1; padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .btn-cancel { background: #fff; border: 1px solid var(--border); }
  .btn-confirm { background: var(--danger); color: #fff; border: none; }

  .debug-banner {
    display: none; background: #FBEAE8; border: 1px solid #E8B4AE; color: var(--danger);
    font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
  }
  .debug-banner.show { display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="headrow">
        <h1>주차장 현황</h1>
        <div class="count"><span class="num" id="occNum">0</span><span class="of"> / 7</span></div>
      </div>
      <div class="sub">카페 · 돈까스 공용 주차장 — 등록 후 3시간 무료</div>
    </header>

    <div class="debug-banner" id="debugBanner"></div>

    <div class="grid" id="spotGrid"></div>

    <div class="status-line" id="statusLine">연결 중…</div>
  </div>

  <div id="formSheet">
    <button type="button" class="sheet-handle" id="sheetToggle">차량 등록 <span class="chevron" id="sheetChevron">▲</span></button>
    <div class="sheet-body" id="sheetBody">
      <div class="sheet-body-inner">
        <form id="addForm">
          <div class="field-row">
            <div>
              <label>차량 번호</label>
              <input type="text" id="plateInput" placeholder="12가 3456" />
            </div>
            <div>
              <label>연락처 (선택)</label>
              <input type="text" id="phoneInput" placeholder="010-0000-0000" />
            </div>
          </div>
          <label>등록 매장</label>
          <div class="store-row" id="storeRow">
            <button type="button" class="store-btn" data-store="cafe">카페</button>
            <button type="button" class="store-btn" data-store="donkatsu">돈까스</button>
          </div>
          <div class="error" id="errorMsg" style="display:none;"></div>
          <button type="submit" class="submit-btn" id="submitBtn">등록하고 타이머 시작</button>
        </form>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3>출차 처리</h3>
      <p><strong id="modalPlate"></strong> 차량을 목록에서 제거할까요?</p>
      <div class="modal-row">
        <button class="btn-cancel" id="modalCancel">취소</button>
        <button class="btn-confirm" id="modalConfirm">출차 완료</button>
      </div>
    </div>
  </div>

<!-- ============================================================
  Firebase SDK (무료 실시간 데이터베이스) - CDN 방식, 별도 설치 불필요
============================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ============================================================
   ⬇️⬇️⬇️ 여기 firebaseConfig 값만 본인 프로젝트 값으로 교체하세요 ⬇️⬇️⬇️
   (Firebase 콘솔 > 프로젝트 설정 > 일반 > "내 앱" 에서 복사)
============================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAvyANB0e_bd78hv7viato-bkhRnTMAqmc",
  authDomain: "parking-3b761.firebaseapp.com",
  databaseURL: "https://parking-3b761-default-rtdb.firebaseio.com/",
  projectId: "parking-3b761",
  storageBucket: "parking-3b761.firebasestorage.app",
  messagingSenderId: "737089930127",
  appId: "1:737089930127:web:402f1ae8dfbfb495a741fa"
};
/* ============================================================ */

const DURATION_MS = 3 * 60 * 60 * 1000;
const TOTAL_SPOTS = 7;
const STORE_META = {
  cafe: { label: "카페", color: "#2F6F62", bg: "#EAF2EF" },
  donkatsu: { label: "돈까스", color: "#9C6B2E", bg: "#F5EEE1" },
};

let cars = [];
let selectedStore = "cafe";
let pendingRemoveId = null;
let connected = false;
let carsRef = null;

const spotGrid = document.getElementById("spotGrid");
const occNum = document.getElementById("occNum");
const statusLine = document.getElementById("statusLine");
const errorMsg = document.getElementById("errorMsg");
const submitBtn = document.getElementById("submitBtn");
const debugBanner = document.getElementById("debugBanner");
const modalBg = document.getElementById("modalBg");
const modalPlate = document.getElementById("modalPlate");

function showDebug(msg) { debugBanner.textContent = msg; debugBanner.classList.add("show"); }
function clearDebug() { debugBanner.classList.remove("show"); }

function pad(n) { return String(n).padStart(2, "0"); }
function formatRemaining(ms) {
  const abs = Math.abs(ms);
  const totalSec = Math.floor(abs / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}
function formatCheckin(ts) {
  const d = new Date(ts);
  const h = d.getHours();
  const m = d.getMinutes();
  const ampm = h < 12 ? "오전" : "오후";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${ampm} ${h12}:${pad(m)} 입차`;
}
function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

// ---------- Firebase 초기화 ----------
try {
  if (String(firebaseConfig.apiKey).includes("여기에") || String(firebaseConfig.databaseURL).includes("여기에")) {
    showDebug("databaseURL이 아직 비어있어요. Realtime Database를 만들고 나오는 주소를 firebaseConfig.databaseURL에 넣어주세요.");
    statusLine.textContent = "설정 필요";
  } else {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    carsRef = db.ref("cars");

    carsRef.on("value", (snapshot) => {
      const val = snapshot.val();
      cars = val ? Object.values(val) : [];
      connected = true;
      clearDebug();
      render();
    }, (err) => {
      showDebug("연결 오류: " + err.message);
    });
  }
} catch (e) {
  showDebug("Firebase 초기화 오류: " + e.message);
}

function render() {
  const now = Date.now();
  const occupied = cars.length;
  occNum.textContent = occupied;
  occNum.className = "num" + (occupied >= TOTAL_SPOTS ? " full" : "");

  spotGrid.innerHTML = "";
  for (let i = 0; i < TOTAL_SPOTS; i++) {
    const car = cars[i];
    const div = document.createElement("div");
    if (!car) {
      div.className = "spot empty";
      div.innerHTML = `<span class="idx">${pad(i + 1)}</span><span class="label">빈자리</span>`;
    } else {
      const meta = STORE_META[car.store] || STORE_META.cafe;
      const elapsed = now - car.startedAt;
      const remaining = DURATION_MS - elapsed;
      const overtime = remaining < 0;
      const pct = Math.min(1, Math.max(0, elapsed / DURATION_MS)) * 100;
      div.className = "spot filled";
      div.style.background = overtime ? "var(--danger-bg)" : meta.bg;
      div.style.border = overtime ? "1px solid #E8B4AE" : "1px solid transparent";
      div.innerHTML = `
        <div class="top">
          <div>
            <div class="tag-spot">SPOT ${pad(i + 1)}</div>
            <div class="plate">${escapeHtml(car.plate)}</div>
          </div>
          <span class="badge" style="background:${meta.color}">${meta.label}</span>
        </div>
        ${car.phone ? `<div class="phone">${escapeHtml(car.phone)}</div>` : ""}
        <div class="checkin">${formatCheckin(car.startedAt)}</div>
        <div class="bottomrow">
          <div class="timer ${overtime ? "over" : ""}">${overtime ? "+" + formatRemaining(remaining) + " 초과" : formatRemaining(remaining)}</div>
          <button class="out-btn" data-id="${car.id}">출차</button>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${overtime ? "var(--danger)" : meta.color}"></div></div>
      `;
    }
    spotGrid.appendChild(div);
  }

  document.querySelectorAll(".out-btn").forEach((btn) => {
    btn.onclick = () => openModal(btn.dataset.id);
  });

  submitBtn.disabled = occupied >= TOTAL_SPOTS;
  submitBtn.textContent = occupied >= TOTAL_SPOTS ? "주차장이 가득 찼습니다" : "등록하고 타이머 시작";
  statusLine.style.display = connected ? "none" : "block";
}

const formSheet = document.getElementById("formSheet");
const sheetToggle = document.getElementById("sheetToggle");
sheetToggle.onclick = () => {
  formSheet.classList.toggle("open");
};

document.querySelectorAll(".store-btn").forEach((btn) => {
  updateStoreBtn(btn);
  btn.onclick = () => {
    selectedStore = btn.dataset.store;
    document.querySelectorAll(".store-btn").forEach(updateStoreBtn);
  };
});
function updateStoreBtn(btn) {
  const meta = STORE_META[btn.dataset.store];
  if (btn.dataset.store === selectedStore) {
    btn.style.background = meta.color; btn.style.color = "#fff"; btn.style.borderColor = meta.color;
  } else {
    btn.style.background = "#fff"; btn.style.color = meta.color; btn.style.borderColor = "var(--border)";
  }
}

document.getElementById("addForm").addEventListener("submit", (e) => {
  e.preventDefault();
  errorMsg.style.display = "none";
  if (!carsRef) { showDebug("Firebase 설정이 안 되어 있어서 저장할 수 없어요."); return; }
  const plateInput = document.getElementById("plateInput");
  const phoneInput = document.getElementById("phoneInput");
  const plate = plateInput.value.trim();
  const phone = phoneInput.value.trim();

  if (!plate) { errorMsg.textContent = "차량 번호를 입력해주세요."; errorMsg.style.display = "block"; return; }
  if (cars.length >= TOTAL_SPOTS) { errorMsg.textContent = "주차장이 가득 찼습니다 (7/7)."; errorMsg.style.display = "block"; return; }

  const id = Date.now() + "-" + Math.random().toString(36).slice(2, 7);
  const newCar = { id, plate, phone, store: selectedStore, startedAt: Date.now() };
  carsRef.child(id).set(newCar).catch((err) => showDebug("저장 실패: " + err.message));
  plateInput.value = ""; phoneInput.value = "";
  formSheet.classList.remove("open");
});

function openModal(id) {
  pendingRemoveId = id;
  const car = cars.find((c) => c.id === id);
  modalPlate.textContent = car ? car.plate : "";
  modalBg.classList.add("show");
}
document.getElementById("modalCancel").onclick = () => { pendingRemoveId = null; modalBg.classList.remove("show"); };
document.getElementById("modalConfirm").onclick = () => {
  if (carsRef && pendingRemoveId) carsRef.child(pendingRemoveId).remove().catch((err) => showDebug("삭제 실패: " + err.message));
  pendingRemoveId = null;
  modalBg.classList.remove("show");
};

setInterval(render, 1000);
</script>
</body>
</html>
