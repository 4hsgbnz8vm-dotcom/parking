<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>redbear garden 주차장</title>
<style>
  :root {
    --bg: #F5EFEC;
    --ink: #2A1E1C;
    --muted: #6b5f5c;
    --faint: #948884;
    --border: #DCD1CD;
    --accent: #8B2E28;
    --accent-bg: #F2E1DD;
    --leaf: #3F7052;
    --danger: #D9483A;
    --danger-bg: #FBEAE8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 90px; transition: padding-bottom 0.3s ease; }
  header { margin-bottom: 20px; }
  .headrow { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  .count { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; }
  .count .num { color: var(--accent); }
  .count .num.full { color: var(--danger); }
  .count .of { color: var(--faint); }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 28px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }

  .spot { border-radius: 16px; padding: 18px; min-height: 100px; }
  .spot.empty { border: 2px dashed var(--border); display: flex; align-items: center; justify-content: space-between; }
  .spot.empty .idx { font-family: ui-monospace, monospace; font-size: 34px; color: #C7C4B8; }
  .spot.empty .label { font-size: 13px; color: #B9B6AB; }
  .spot.filled { border: 1px solid transparent; border-left: 4px solid var(--leaf); background: var(--accent-bg); }
  .spot .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .spot .tag-spot { font-family: ui-monospace, monospace; font-size: 12px; color: var(--faint); }
  .spot .plate { font-size: 20px; font-weight: 800; margin-top: 2px; word-break: break-all; }
  .phone { font-size: 14px; color: var(--muted); margin-bottom: 2px; }
  .checkin { font-size: 13px; color: var(--faint); margin-bottom: 12px; }
  .bottomrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .timer { font-family: ui-monospace, monospace; font-size: 18px; }
  .timer.over { color: var(--danger); font-weight: 700; }
  .out-btn { font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 10px; background: #fff; border: 1px solid var(--border); cursor: pointer; }
  .out-btn:active { transform: scale(0.96); }
  .bar-track { margin-top: 12px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.7); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s; }

  #formSheet { background: #fff; border: 1px solid #E4E1D8; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-width: 720px; margin: 0 auto; box-shadow: 0 -6px 20px rgba(34,49,37,0.10); border-radius: 16px 16px 0 0; }
  .sheet-handle { width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; background: none; border: none; padding: 14px; font-size: 15px; font-weight: 700; color: var(--ink); cursor: pointer; }
  .sheet-handle .chevron { font-size: 12px; transition: transform 0.25s ease; }
  #formSheet.open .sheet-handle .chevron { transform: rotate(180deg); }
  .sheet-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
  #formSheet.open .sheet-body { max-height: 70vh; overflow-y: auto; }
  .sheet-body-inner { padding: 0 20px calc(20px + env(safe-area-inset-bottom)); }
  form { margin: 0; }
  .field-row { margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=number] { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 16px; outline: none; }
  input[type=text]:focus, input[type=number]:focus { box-shadow: 0 0 0 2px var(--accent); }
  .error { color: var(--danger); font-size: 14px; margin-bottom: 12px; }
  .submit-btn {
    width: 100%; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 16px;
    color: #fff; border: none; cursor: pointer;
    background: linear-gradient(135deg, #B0453A 0%, #7A241D 55%, #9C2E27 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 4px 10px rgba(139,46,40,0.35);
  }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .status-line { text-align: center; font-size: 13px; color: var(--faint); margin-top: 16px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal-bg.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 22px; max-width: 360px; width: 100%; }
  .modal h3 { margin: 0 0 8px; font-size: 17px; }
  .modal p { font-size: 14px; color: var(--muted); margin-bottom: 18px; }
  .modal-row { display: flex; gap: 8px; }
  .modal-row button { flex: 1; padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .btn-cancel { background: #fff; border: 1px solid var(--border); }
  .btn-confirm { background: var(--danger); color: #fff; border: none; }
  .btn-save { background: var(--accent); color: #fff; border: none; }

  .debug-banner { display: none; background: #FBEAE8; border: 1px solid #E8B4AE; color: var(--danger); font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; }
  .debug-banner.show { display: block; }

  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--ink); color: #fff; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.2); opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 100; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .icon-btn { position: fixed; top: 16px; z-index: 30; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #bellBtn { right: 16px; }
  #bellBtn.muted { opacity: 0.4; }
  #gearBtn { left: 16px; }
</style>
</head>
<body>
  <button class="icon-btn" id="gearBtn" title="설정">⚙️</button>
  <button class="icon-btn" id="bellBtn" title="알림 소리 켜기/끄기">🔔</button>
  <div class="toast" id="toast"></div>

  <div class="wrap">
    <header>
      <div class="headrow">
        <h1>redbear garden 주차장</h1>
        <div class="count"><span class="num" id="occNum">0</span><span class="of"> / <span id="totalNum">-</span></span></div>
      </div>
      <div class="sub" id="subLine">등록 후 무료 이용 시간이 적용돼요</div>
    </header>

    <div class="debug-banner" id="debugBanner"></div>
    <div class="grid" id="spotGrid"></div>
    <div class="status-line" id="statusLine">연결 중…</div>
  </div>

  <div id="formSheet">
    <button type="button" class="sheet-handle" id="sheetToggle">차량 등록 <span class="chevron" id="sheetChevron">▲</span></button>
    <div class="sheet-body" id="sheetBody">
      <div class="sheet-body-inner">
        <form id="addForm">
          <div class="field-row">
            <label>차량 번호</label>
            <input type="text" id="plateInput" placeholder="12가 3456" />
          </div>
          <div class="field-row">
            <label>연락처 (선택)</label>
            <input type="text" id="phoneInput" placeholder="010-0000-0000" />
          </div>
          <div class="error" id="errorMsg" style="display:none;"></div>
          <button type="submit" class="submit-btn" id="submitBtn">등록하고 타이머 시작</button>
        </form>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3>출차 처리</h3>
      <p><strong id="modalPlate"></strong> 차량을 목록에서 제거할까요?</p>
      <div class="modal-row">
        <button class="btn-cancel" id="modalCancel">취소</button>
        <button class="btn-confirm" id="modalConfirm">출차 완료</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="settingsBg">
    <div class="modal">
      <h3>주차장 설정</h3>
      <div class="field-row">
        <label>총 자리 수</label>
        <input type="number" id="settingsSpots" min="1" max="50" />
      </div>
      <div class="field-row">
        <label>무료 이용 시간 (시간)</label>
        <input type="number" id="settingsHours" min="0.5" step="0.5" />
      </div>
      <div class="modal-row">
        <button class="btn-cancel" id="settingsCancel">취소</button>
        <button class="btn-save" id="settingsSave">저장</button>
      </div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* 카페 페이지와 같은 Firebase 프로젝트를 쓰되, 데이터 위치는 redbear_* 로 완전히 분리 */
const firebaseConfig = {
  apiKey: "AIzaSyAvyANB0e_bd78hv7viato-bkhRnTMAqmc",
  authDomain: "parking-3b761.firebaseapp.com",
  databaseURL: "https://parking-3b761-default-rtdb.firebaseio.com/",
  projectId: "parking-3b761",
  storageBucket: "parking-3b761.firebasestorage.app",
  messagingSenderId: "737089930127",
  appId: "1:737089930127:web:402f1ae8dfbfb495a741fa"
};

let TOTAL_SPOTS = 5;
let DURATION_HOURS = 3;
let DURATION_MS = DURATION_HOURS * 60 * 60 * 1000;

let cars = [];
let pendingRemoveId = null;
let connected = false;
let carsRef = null;
let settingsRef = null;
let knownIds = null;
let overtimeNotified = new Set();
let soundOn = true;
let audioUnlocked = false;
let audioCtx = null;

const spotGrid = document.getElementById("spotGrid");
const occNum = document.getElementById("occNum");
const totalNum = document.getElementById("totalNum");
const subLine = document.getElementById("subLine");
const statusLine = document.getElementById("statusLine");
const errorMsg = document.getElementById("errorMsg");
const submitBtn = document.getElementById("submitBtn");
const debugBanner = document.getElementById("debugBanner");
const modalBg = document.getElementById("modalBg");
const modalPlate = document.getElementById("modalPlate");
const bellBtn = document.getElementById("bellBtn");
const gearBtn = document.getElementById("gearBtn");
const toast = document.getElementById("toast");
const settingsBg = document.getElementById("settingsBg");
const settingsSpots = document.getElementById("settingsSpots");
const settingsHours = document.getElementById("settingsHours");

function showDebug(msg) { debugBanner.textContent = msg; debugBanner.classList.add("show"); }
function clearDebug() { debugBanner.classList.remove("show"); }
function pad(n) { return String(n).padStart(2, "0"); }
function formatRemaining(ms) {
  const abs = Math.abs(ms);
  const totalSec = Math.floor(abs / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}
function formatCheckin(ts) {
  const d = new Date(ts);
  const h = d.getHours(); const m = d.getMinutes();
  const ampm = h < 12 ? "오전" : "오후";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${ampm} ${h12}:${pad(m)} 입차`;
}
function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

bellBtn.onclick = () => {
  soundOn = !soundOn;
  bellBtn.textContent = soundOn ? "🔔" : "🔕";
  bellBtn.classList.toggle("muted", !soundOn);
  unlockAudio();
};
document.body.addEventListener("click", unlockAudio, { once: true });

function unlockAudio() {
  if (audioUnlocked) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioUnlocked = true; } catch (e) {}
  if (window.Notification && Notification.permission === "default") Notification.requestPermission();
}
function pushSystemNotification(title, body) {
  if (!window.Notification || Notification.permission !== "granted") return;
  try { new Notification(title, { body, tag: "redbear-parking-alert" }); } catch (e) {}
}
function playBeep() {
  if (!soundOn || !audioCtx) return;
  const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
  o.type = "sine"; o.frequency.value = 880;
  g.gain.setValueAtTime(0.15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.5);
  setTimeout(() => {
    const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
    o2.type = "sine"; o2.frequency.value = 1046;
    g2.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    o2.connect(g2); g2.connect(audioCtx.destination); o2.start(); o2.stop(audioCtx.currentTime + 0.5);
  }, 180);
}
function showToast(msg) {
  toast.textContent = msg; toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 4000);
}
function notifyNewCar(car) {
  showToast(`🚗 새 차량 등록 — ${car.plate}`);
  playBeep();
  if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
  pushSystemNotification("새 차량 등록", car.plate);
}
function notifyOvertime(car) {
  showToast(`⏰ 시간 초과 — ${car.plate}`);
  playBeep();
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
  pushSystemNotification("주차 시간 초과", `${car.plate} — ${DURATION_HOURS}시간 경과`);
}

try {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  carsRef = db.ref("redbear_cars");
  settingsRef = db.ref("redbear_settings");

  settingsRef.on("value", (snap) => {
    const v = snap.val();
    if (v) {
      TOTAL_SPOTS = v.totalSpots || TOTAL_SPOTS;
      DURATION_HOURS = v.durationHours || DURATION_HOURS;
      DURATION_MS = DURATION_HOURS * 60 * 60 * 1000;
    }
    totalNum.textContent = TOTAL_SPOTS;
    subLine.textContent = `등록 후 ${DURATION_HOURS}시간까지 무료예요`;
    settingsSpots.value = TOTAL_SPOTS;
    settingsHours.value = DURATION_HOURS;
    render();
  });

  carsRef.on("value", (snapshot) => {
    const val = snapshot.val();
    cars = val ? Object.values(val) : [];
    const currentIds = new Set(cars.map((c) => c.id));
    if (knownIds !== null) {
      cars.forEach((c) => { if (!knownIds.has(c.id)) notifyNewCar(c); });
    }
    knownIds = currentIds;
    connected = true;
    clearDebug();
    render();
  }, (err) => { showDebug("연결 오류: " + err.message); });
} catch (e) {
  showDebug("Firebase 초기화 오류: " + e.message);
}

function render() {
  const now = Date.now();
  const occupied = cars.length;
  occNum.textContent = occupied;
  occNum.className = "num" + (occupied >= TOTAL_SPOTS ? " full" : "");

  const stillHereIds = new Set();
  spotGrid.innerHTML = "";
  for (let i = 0; i < TOTAL_SPOTS; i++) {
    const car = cars[i];
    const div = document.createElement("div");
    if (!car) {
      div.className = "spot empty";
      div.innerHTML = `<span class="idx">${pad(i + 1)}</span><span class="label">빈자리</span>`;
    } else {
      stillHereIds.add(car.id);
      const elapsed = now - car.startedAt;
      const remaining = DURATION_MS - elapsed;
      const overtime = remaining < 0;
      if (overtime && !overtimeNotified.has(car.id)) {
        overtimeNotified.add(car.id);
        notifyOvertime(car);
      }
      const pct = Math.min(1, Math.max(0, elapsed / DURATION_MS)) * 100;
      div.className = "spot filled";
      if (overtime) { div.style.background = "var(--danger-bg)"; div.style.border = "1px solid #E8B4AE"; div.style.borderLeft = "4px solid var(--danger)"; }
      div.innerHTML = `
        <div class="top">
          <div>
            <div class="tag-spot">SPOT ${pad(i + 1)}</div>
            <div class="plate">${escapeHtml(car.plate)}</div>
          </div>
        </div>
        ${car.phone ? `<div class="phone">${escapeHtml(car.phone)}</div>` : ""}
        <div class="checkin">${formatCheckin(car.startedAt)}</div>
        <div class="bottomrow">
          <div class="timer ${overtime ? "over" : ""}">${overtime ? "+" + formatRemaining(remaining) + " 초과" : formatRemaining(remaining)}</div>
          <button class="out-btn" data-id="${car.id}">출차</button>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${overtime ? "var(--danger)" : "var(--leaf)"}"></div></div>
      `;
    }
    spotGrid.appendChild(div);
  }
  overtimeNotified.forEach((id) => { if (!stillHereIds.has(id)) overtimeNotified.delete(id); });

  document.querySelectorAll(".out-btn").forEach((btn) => { btn.onclick = () => openModal(btn.dataset.id); });

  submitBtn.disabled = occupied >= TOTAL_SPOTS;
  submitBtn.textContent = occupied >= TOTAL_SPOTS ? "주차장이 가득 찼습니다" : "등록하고 타이머 시작";
  statusLine.style.display = connected ? "none" : "block";
}

document.getElementById("addForm").addEventListener("submit", (e) => {
  e.preventDefault();
  errorMsg.style.display = "none";
  if (!carsRef) { showDebug("설정이 안 되어 있어서 등록할 수 없어요."); return; }
  const plateInput = document.getElementById("plateInput");
  const phoneInput = document.getElementById("phoneInput");
  const plate = plateInput.value.trim();
  const phone = phoneInput.value.trim();
  if (!plate) { errorMsg.textContent = "차량 번호를 입력해주세요."; errorMsg.style.display = "block"; return; }
  if (cars.length >= TOTAL_SPOTS) { errorMsg.textContent = "주차장이 가득 찼습니다."; errorMsg.style.display = "block"; return; }
  const id = Date.now() + "-" + Math.random().toString(36).slice(2, 7);
  const newCar = { id, plate, phone, startedAt: Date.now() };
  carsRef.child(id).set(newCar).catch((err) => showDebug("저장 실패: " + err.message));
  plateInput.value = ""; phoneInput.value = "";
  document.getElementById("formSheet").classList.remove("open");
});

function openModal(id) {
  pendingRemoveId = id;
  const car = cars.find((c) => c.id === id);
  modalPlate.textContent = car ? car.plate : "";
  modalBg.classList.add("show");
}
document.getElementById("modalCancel").onclick = () => { pendingRemoveId = null; modalBg.classList.remove("show"); };
document.getElementById("modalConfirm").onclick = () => {
  if (carsRef && pendingRemoveId) carsRef.child(pendingRemoveId).remove().catch((err) => showDebug("삭제 실패: " + err.message));
  pendingRemoveId = null;
  modalBg.classList.remove("show");
};

const formSheet = document.getElementById("formSheet");
document.getElementById("sheetToggle").onclick = () => formSheet.classList.toggle("open");

gearBtn.onclick = () => {
  settingsSpots.value = TOTAL_SPOTS;
  settingsHours.value = DURATION_HOURS;
  settingsBg.classList.add("show");
};
document.getElementById("settingsCancel").onclick = () => settingsBg.classList.remove("show");
document.getElementById("settingsSave").onclick = () => {
  const spots = parseInt(settingsSpots.value, 10);
  const hours = parseFloat(settingsHours.value);
  if (!spots || spots < 1) { alert("자리 수를 올바르게 입력해주세요."); return; }
  if (!hours || hours <= 0) { alert("무료 시간을 올바르게 입력해주세요."); return; }
  settingsRef.set({ totalSpots: spots, durationHours: hours })
    .then(() => settingsBg.classList.remove("show"))
    .catch((err) => showDebug("설정 저장 실패: " + err.message));
};

setInterval(render, 1000);
</script>
</body>
</html>
